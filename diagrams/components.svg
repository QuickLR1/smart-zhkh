e="#456078" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1110" y="585" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#18354d" text-anchor="middle">Record changes</text><polyline points="250,785 250,940" fill="none" stroke="#456078" stroke-width="1.6" marker-end="url(#arrow)"/><text x="355" y="885" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#18354d" text-anchor="middle">Load inference artifacts</text><polyline points="685,785 685,885 880,885 880,940" fill="none" stroke="#456078" stroke-width="1.6" marker-end="url(#arrow)"/><text x="810" y="870" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#18354d" text-anchor="middle">Read directory and routing rules</text><polyline points="1135,785 1135,940" fill="none" stroke="#456078" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1205" y="895" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#18354d" text-anchor="middle">Store history</text><text x="250" y="1070" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18354d" text-anchor="middle">Training and evaluation are performed</text><text x="250" y="1090" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18354d" text-anchor="middle">separately from request processing.</text><text x="1050" y="1070" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18354d" text-anchor="middle">Demonstration service directory</text><text x="1050" y="1090" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#18354d" text-anchor="middle">and non-sensitive test data.</text><text x="720" y="1140" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#18354d" text-anchor="middle">Dispatcher confirms assignments. Classification failure preserves the request for manual review.</text></svg>