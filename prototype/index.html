<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Housing Services · Prototype</title><style>
:root{font:15px system-ui,sans-serif;color:#18342f;background:#f3f6f4}*{box-sizing:border-box}body{margin:0}header{background:#123e34;color:white;padding:22px max(24px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:21px;margin:0}header small{color:#b8d4c7}.badge{border:1px solid #789d8c;border-radius:30px;padding:6px 12px;font-size:12px;white-space:nowrap}main{max-width:1180px;margin:auto;padding:24px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}button,select,input,textarea{font:inherit}button{border:1px solid #cedbd4;background:white;color:#204e40;border-radius:8px;padding:10px 16px;cursor:pointer}button:hover{background:#e8f2eb}button.active,.primary{background:#1f684f;color:white;border-color:#1f684f}button:disabled{opacity:.5;cursor:default}h2{font-size:28px;margin:0 0 8px;letter-spacing:-.7px}p{line-height:1.6}.muted{color:#62756d}.intro{margin-bottom:24px}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.8fr);gap:24px}.panel{padding:24px;background:white;border:1px solid #dce5df;border-radius:14px;margin-bottom:18px;min-width:0}h3{margin:0 0 16px;font-size:18px}label{display:block;font-size:13px;font-weight:650;margin:16px 0 6px}input,textarea,select{width:100%;border:1px solid #c4d2c9;border-radius:7px;padding:11px;background:white;color:#18342f}textarea{min-height:110px;resize:vertical}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d5a943;outline-offset:2px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#edf3ef;color:#3d6354;font-size:12px}.Submitted{background:#fff1cf;color:#805d0c}.Assigned{background:#e4eefc;color:#345582}.Resolved{background:#dff3e6;color:#23623a}.request{border:1px solid #dce5df;border-radius:10px;padding:15px;margin-top:12px}.request p{margin:10px 0;overflow-wrap:anywhere}.id{font-size:12px;font-weight:700;color:#697b72}.hint{background:#f6f8f5;border-left:3px solid #c4a550;padding:12px 16px;font-size:13px}.empty{padding:24px;text-align:center;color:#687d72}.history{font-size:13px;border-top:1px solid #e4eae6;margin-top:20px;padding-top:12px}.history p{margin:8px 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#173f33;color:white;padding:13px 22px;border-radius:10px;max-width:90%;z-index:5}.stats{display:flex;gap:16px;margin:20px 0}.stat{background:white;border:1px solid #dce5df;border-radius:10px;padding:14px 20px;flex:1}.stat strong{display:block;font-size:27px}.stat span{font-size:12px;color:#64796f}.servicebar{max-width:440px;margin-bottom:20px}footer{font-size:12px;color:#718177;padding:20px 0}details summary{cursor:pointer;font-size:13px;margin-top:18px}@media(max-width:750px){.grid{grid-template-columns:1fr}main{padding:18px}header{padding:18px;align-items:flex-start}header .badge{display:none}h2{font-size:24px}.panel{padding:18px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:22px}}
</style><header><div><h1>Smart Housing Services</h1><small>Resident requests, clearly connected.</small></div><span class="badge">INTERACTIVE UX PROTOTYPE</span></header><main><nav id="nav" aria-label="Demo role"></nav><div id="content"></div><footer class="row"><span>Isain Bexultan · SE2402 · Supervisor: Shynar Akhmetzhanova</span><button id="reset">Reset demo</button></footer></main><div id="toast" role="status" hidden></div><script>
const categories=['Water supply','Heating','Electricity','Waste collection','Building maintenance','Other / Needs review'];const services=['Water Service','Heating Service','Electrical Service','Waste Service','Building Maintenance'];
let role='Resident',selected=1,filter='All',staffService='Heating Service';let requests=[{id:1,owner:'Resident A',text:'В квартире холодно, отопление не работает второй день.',address:'Demo Street 12, apartment 8',category:'Heating',suggestion:'Heating',recommended:'Heating Service',service:'',status:'Submitted',history:['Demo seed: submitted by Resident A.','Demo rule suggested Heating / Heating Service.']},{id:2,owner:'Resident A',text:'Мусорные контейнеры переполнены.',address:'Demo Avenue 5',category:'Waste collection',suggestion:'Waste collection',recommended:'Waste Service',service:'Waste Service',status:'Assigned',history:['Demo seed: submitted by Resident A.','Dispatcher assigned Waste Service.']},{id:3,owner:'Resident B',text:'Не работает освещение в подъезде.',address:'Example Road 9',category:'Electricity',suggestion:'Electricity',recommended:'Electrical Service',service:'Electrical Service',status:'In progress',history:['Demo seed: submitted by Resident B.','Dispatcher assigned Electrical Service.','Service staff started work.']}];
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pill=r=>`<span class="pill ${r.status}">${r.status}</span>`;const options=(xs,val)=>xs.map(x=>`<option ${x===val?'selected':''}>${esc(x)}</option>`).join('');function notice(t){let e=document.getElementById('toast');e.textContent=t;e.hidden=false;setTimeout(()=>e.hidden=true,4000)}function record(r,t){r.history.push(new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+' · '+t)}
function classify(text){const rules=[/вод|water|теч[её]т|протеч/i,/отоп|батаре|холод|heat/i,/элект|свет|освещ|electric/i,/мусор|отход|waste/i,/крыш|двер|лифт|roof|lift/i];let hits=rules.map((re,i)=>re.test(text)?i:-1).filter(i=>i>=0);return hits.length===1?hits[0]:5}
function card(r,action=false){return `<article class="request"><div class="row"><span class="id">REQ-${String(r.id).padStart(3,'0')}</span>${pill(r)}</div><p>${esc(r.text)}</p><small class="muted">${esc(r.address)}</small><p><span class="pill">${esc(r.category)}</span></p><small>${r.service?'Assigned to '+esc(r.service):'Awaiting dispatcher confirmation'}</small>${action?`<p><button data-open="${r.id}">${selected===r.id?'Selected':'Review request'}</button></p>`:''}${!action?`<details><summary>Request history</summary>${history(r)}</details>`:''}</article>`}function history(r){return `<div class="history">${r.history.map(x=>`<p>${esc(x)}</p>`).join('')}</div>`}
function render(){document.getElementById('nav').innerHTML=['Resident','Dispatcher','Service staff'].map(x=>`<button data-role="${x}" class="${role===x?'active':''}" aria-pressed="${role===x}">${x}</button>`).join('');let c=document.getElementById('content');let count=requests.filter(r=>r.status==='Submitted').length;c.innerHTML=`<div class="intro"><h2>${role==='Resident'?'Your home. Your requests.':role==='Dispatcher'?'Review, then route.':'Assigned service work.'}</h2><p class="muted">${role==='Resident'?'Demo resident: Resident A. Submit a problem and follow its progress.':role==='Dispatcher'?'Confirm the category and responsible service before assigning a request.':'Choose a demonstration service and update its assigned requests.'}</p></div><div class="hint">UX demonstration only. Suggestions use simple keyword rules, not a trained AI model. Role switching is simulated; there is no login, backend or real access protection. Data resets on reload.</div>`;
if(role==='Resident'){c.innerHTML+=`<div class="stats"><div class="stat"><strong>${requests.filter(r=>r.owner==='Resident A').length}</strong><span>My requests</span></div><div class="stat"><strong>${requests.filter(r=>r.owner==='Resident A'&&r.status==='Resolved').length}</strong><span>Resolved</span></div></div><div class="grid"><section class="panel"><h3>Submit a request</h3><form id="submit"><label for="address">Address</label><input id="address" required maxlength="200" placeholder="Street, building, apartment"><label for="description">What happened?</label><textarea id="description" required maxlength="3000" placeholder="Например: в доме не работает отопление"></textarea><p class="muted">Use demonstration data only. A dispatcher checks every assignment.</p><button class="primary">Submit request</button></form></section><section class="panel"><h3>My requests</h3>${requests.filter(r=>r.owner==='Resident A').slice().reverse().map(r=>card(r)).join('')}</section></div>`;document.getElementById('submit').onsubmit=e=>{e.preventDefault();let a=document.getElementById('address').value.trim(),t=document.getElementById('description').value.trim();if(!a||!t)return notice('Enter a description and address.');let i=classify(t);let r={id:Math.max(...requests.map(r=>r.id))+1,owner:'Resident A',text:t,address:a,category:categories[i],suggestion:categories[i],recommended:services[i]||'',service:'',status:'Submitted',history:[]};record(r,'Resident A submitted the request.');record(r,'Demo rule suggestion: '+r.category);requests.push(r);selected=r.id;render();notice('Request saved. Awaiting dispatcher review.')}}
if(role==='Dispatcher'){let r=requests.find(r=>r.id===selected)||requests[0];c.innerHTML+=`<div class="stats"><div class="stat"><strong>${count}</strong><span>Awaiting review</span></div><div class="stat"><strong>${requests.length}</strong><span>Total requests</span></div></div><div class="grid"><section class="panel"><h3>Request queue</h3><label for="filter">Filter by status</label><select id="filter">${options(['All','Submitted','Assigned','In progress','Resolved'],filter)}</select>${requests.filter(r=>filter==='All'||r.status===filter).map(r=>card(r,true)).join('')||'<p class="empty">No matching requests.</p>'}</section><section class="panel"><h3>Review REQ-${String(r.id).padStart(3,'0')}</h3><p>${esc(r.text)}</p><p class="muted">${esc(r.address)}</p><div class="hint">Original rule suggestion: ${esc(r.suggestion)}<br>Suggested service: ${esc(r.recommended||'Manual selection required')}</div>${r.status==='Submitted'?`<form id="assign"><label for="category">Final category</label><select id="category">${options(categories,r.category)}</select><label for="service">Responsible service</label><select id="service" required><option value="">Select a service</option>${options(services,r.recommended)}</select><p class="muted">Confirm the service explicitly. Changing a category does not assign the request.</p><button class="primary">Confirm assignment</button></form>`:'<p>This request has already been assigned. Reassignment is outside this UX demo.</p>'}<h3 style="margin-top:24px">Activity</h3>${history(r)}</section></div>`;document.getElementById('filter').onchange=e=>{filter=e.target.value;render()};let f=document.getElementById('assign');if(f)f.onsubmit=e=>{e.preventDefault();let cat=document.getElementById('category').value,svc=document.getElementById('service').value;if(cat==='Other / Needs review')return notice('Choose a supported final category before assignment.');if(!svc)return;record(r,'Dispatcher confirmed '+cat+' / '+svc+'. Previous category: '+r.category);r.category=cat;r.service=svc;r.status='Assigned';render();notice('Assignment confirmed. The service can now start work.')}}
if(role==='Service staff'){let list=requests.filter(r=>r.service===staffService);c.innerHTML+=`<div class="servicebar"><label for="staffService">Demo service</label><select id="staffService">${options(services,staffService)}</select></div><section class="panel"><h3>Service queue</h3>${list.map(r=>card(r)+ (r.status==='Assigned'?`<p><button class="primary" data-start="${r.id}">Start work on REQ-${r.id}</button></p>`:r.status==='In progress'?`<form data-resolve="${r.id}"><label for="note-${r.id}">Resolution note for REQ-${r.id}</label><textarea id="note-${r.id}" required maxlength="1000" placeholder="Describe the work completed"></textarea><p><button class="primary">Mark resolved</button></p></form>`:'')).join('')||'<p class="empty">No requests assigned to this service.</p>'}</section>`;document.getElementById('staffService').onchange=e=>{staffService=e.target.value;render()};document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{let r=requests.find(r=>r.id===+b.dataset.start);if(r.service===staffService&&r.status==='Assigned'){r.status='In progress';record(r,'Service staff started work.');render()}});document.querySelectorAll('[data-resolve]').forEach(f=>f.onsubmit=e=>{e.preventDefault();let r=requests.find(r=>r.id===+f.dataset.resolve),n=document.getElementById('note-'+r.id).value.trim();if(!n)return notice('Add a resolution note.');if(r.service===staffService&&r.status==='In progress'){r.status='Resolved';record(r,'Service staff resolved: '+n);render();notice('Resolution recorded. The resident can see the new status.')}})}
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{selected=+b.dataset.open;render()})}document.getElementById('reset').onclick=()=>{if(confirm('Reset all demonstration changes?'))location.reload()};render();
</script></html>
